name: CI

on:
  push:
    branches: [main]
    paths: &code
      - "*.nix"
      - "*.sh"
      - flake.lock
      - ci/**
      - .github/workflows/ci.yml
  pull_request:
    paths: *code
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # once a week: the agents publish @latest daily

jobs:
  # Everything that can fail on a host is checked here first, on both
  # systems, before anything is deployed: every output evaluates, then each
  # system builds all of its checks (checks.nix): the module in a real
  # Home Manager / nix-darwin build, shellcheck over the generated
  # activation steps, the answer-file logic, what is installed by default,
  # and the ask/plan scripts.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Evaluate all outputs
        run: nix flake check --all-systems --no-build
      - name: Build this system's checks
        run: nix flake check -L
      - name: Helpers parse
        run: |
          bash -n ci/e2e-deploy.sh
          python3 -m py_compile ci/acp-initialize.py

  # The real flow on a runner, only after both systems passed: claude,
  # codex, pi and goose with their ACP adapters, and herdr; each must run,
  # and each ACP agent must complete initialize.
  # A second deploy must succeed as a no-op, and the plan must read the result.
  deploy:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Deploy onto the runner
        run: ./ci/e2e-deploy.sh
      - name: Each ACP agent answers initialize
        run: PATH="$AGENT_CAMP_PATH" python3 ci/acp-initialize.py
      - name: Re-deploy (idempotent)
        run: ./ci/e2e-deploy.sh
      - name: Plan
        run: PATH="$AGENT_CAMP_PATH" nix run .#plan
